name: PR 166000 canonical package proof

on:
  push:
    branches: [proof/build-166000-20261015]
    paths: [.github/workflows/proof-build-166000.yml]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact 40-hex product commit to package
        required: true
        type: string
        default: e7ad0a972bbab870a047c00c4e9d1675cca5c8fe

permissions:
  contents: read

concurrency:
  group: proof-build-166000-20261015
  cancel-in-progress: false

jobs:
  canonical-package:
    if: github.repository == 'dankarization/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=8192
      OPENCLAW_TSDOWN_MAX_OLD_SPACE_MB: "8192"
      OPENCLAW_DOCKER_PACKAGE_BUILD_TIMEOUT_MS: "2700000"
      OPENCLAW_DOCKER_PACKAGE_PACK_TIMEOUT_MS: "600000"
    steps:
      - name: Validate immutable target
        id: target
        shell: bash
        env:
          REQUESTED_TARGET: ${{ inputs.target_sha || 'e7ad0a972bbab870a047c00c4e9d1675cca5c8fe' }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_TARGET" =~ ^[0-9a-fA-F]{40}$ ]]
          printf 'sha=%s\n' "${REQUESTED_TARGET,,}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact product revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false

      - name: Verify product source
        id: source
        shell: bash
        env:
          TARGET_COMMIT: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
          target_tree="$(git rev-parse 'HEAD^{tree}')"
          case "$TARGET_COMMIT" in
            e7ad0a972bbab870a047c00c4e9d1675cca5c8fe) test "$target_tree" = af9dbbb7d52d13d281fcd65c60c14f345e7353d4 ;;
            a43613ac57ccb42543a66db3515ca947e312e118) test "$target_tree" = d831096203bb95a4cf7ba16825695def02e04fc2 ;;
          esac
          printf 'tree=%s\n' "$target_tree" >> "$GITHUB_OUTPUT"
          git diff --quiet
          mkdir -p "$RUNNER_TEMP/pr-166000-package/artifact"
          date -u +%FT%TZ > "$RUNNER_TEMP/pr-166000-package/started-at.txt"

      - name: Setup native Node environment
        id: setup
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.x"
          install-bun: "false"
          install-deps: "true"
          frozen-lockfile: "true"
          cache-mode: "off"

      - name: Build and pack canonical candidate
        id: package
        shell: bash
        env:
          TARGET_COMMIT: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          node scripts/package-openclaw-for-docker.mjs \
            --allow-unreleased-changelog \
            --output-dir "$RUNNER_TEMP/pr-166000-package/output" \
            --output-name "openclaw-updater-${TARGET_COMMIT}.tgz" \
            2>&1 | tee "$RUNNER_TEMP/pr-166000-package/artifact/build.log"

      - name: Record build outcome and verified package hash
        if: always()
        id: receipt
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.package.outcome }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          TARGET_COMMIT: ${{ steps.target.outputs.sha }}
          TARGET_TREE: ${{ steps.source.outputs.tree }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          import crypto from "node:crypto";
          import { execFileSync } from "node:child_process";
          const root = path.join(process.env.RUNNER_TEMP, "pr-166000-package");
          const artifact = path.join(root, "artifact");
          fs.mkdirSync(artifact, { recursive: true });
          const target = process.env.TARGET_COMMIT;
          const tree = process.env.TARGET_TREE;
          const git = (...args) => {
            try { return execFileSync("git", args, { encoding: "utf8", stdio: ["ignore", "pipe", "pipe"] }).trim(); }
            catch { return null; }
          };
          const receipt = {
            targetCommit: target, targetTree: tree,
            observedCommit: git("rev-parse", "HEAD"), observedTree: git("rev-parse", "HEAD^{tree}"),
            trackedSourceClean: git("status", "--porcelain", "--untracked-files=no") === "",
            workflowCommit: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            sourceOutcome: process.env.SOURCE_OUTCOME, setupOutcome: process.env.SETUP_OUTCOME,
            buildOutcome: process.env.BUILD_OUTCOME, finishedAt: new Date().toISOString(),
            node: process.version, platform: process.platform, architecture: process.arch,
            nativeBuildBudgetMs: 2700000, nativePackBudgetMs: 600000,
            packageVerified: false,
          };
          const name = `openclaw-updater-${target}.tgz`;
          const source = path.join(root, "output", name);
          if (receipt.buildOutcome === "success" && receipt.sourceOutcome === "success" &&
              receipt.observedCommit === target && receipt.observedTree === tree &&
              receipt.trackedSourceClean && fs.existsSync(source)) {
            const bytes = fs.readFileSync(source);
            receipt.packageVerified = true;
            receipt.package = { filename: name, bytes: bytes.length, sha256: crypto.createHash("sha256").update(bytes).digest("hex") };
            fs.copyFileSync(source, path.join(artifact, name));
            fs.writeFileSync(path.join(artifact, `${name}.sha256`), `${receipt.package.sha256}  ${name}\n`);
          }
          fs.writeFileSync(path.join(artifact, "receipt.json"), `${JSON.stringify(receipt, null, 2)}\n`);
          if (receipt.buildOutcome === "success" && !receipt.packageVerified) process.exitCode = 1;
          NODE

      - name: Upload candidate package or failure receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: updater-package-${{ steps.target.outputs.sha }}
          path: ${{ runner.temp }}/pr-166000-package/artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
